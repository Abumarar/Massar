kind = "mobile"
previewPath = "/massar/"
title = "Massar (مسار)"
description = "A mobile intercity ride-sharing prototype for Jordan that matches passengers with route-compatible captains and lets passengers book one or more seats."
version = "1.0.0"
id = "artifacts/massar"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/massar/" ]
localPort = 19610

[services.development]
run = "pnpm --filter @workspace/massar run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/massar", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/massar", "run", "serve" ]

[services.env]
PORT = "19610"
BASE_PATH = "/massar/"
